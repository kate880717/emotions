<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>감정 알기 대모험 ✨</title>
<script src="https://cdn.tailwindcss.com"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Jua&display=swap');

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;margin:0;padding:0}
body{font-family:'Jua','Gaegu','Malgun Gothic',sans-serif;background:#dde3ee}
#root{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:8px}

#app{
  width:100%;
  max-width:1024px;
  height:calc(100vh - 16px);
  max-height:920px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  background:linear-gradient(145deg,#fff9fb 0%,#f0f4ff 100%);
  border-radius:2rem;
  box-shadow:0 30px 60px -15px rgba(0,0,0,.25);
}

.card{background:#fff;border-radius:1.5rem;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.card-pink{border:4px solid #fbcfe8}
.card-indigo{border:4px solid #c7d2fe}
.card-amber{border:4px solid #fde68a}
.card-emerald{border:4px solid #a7f3d0}
.word-keep{word-break:keep-all}

.border-3{border-width:3px}

@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.float{animation:float 3.5s ease-in-out infinite}

@keyframes sticker-fly{0%{transform:translate(0,0) scale(0) rotate(0);opacity:0}30%{opacity:1;transform:translate(var(--tx,0),var(--ty,-50px)) scale(1.4) rotate(180deg)}100%{transform:translate(var(--tx,0),var(--ty,-200px)) scale(.8) rotate(360deg);opacity:0}}
.sticker-fly{animation:sticker-fly 2s ease-out forwards;position:absolute;font-size:60px;pointer-events:none;z-index:100}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.shake{animation:shake .4s}

@keyframes bounce-in{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.bounce-in{animation:bounce-in .5s}

.tts-highlight{background:linear-gradient(180deg,transparent 60%,#fef08a 60%);transition:all .2s;font-weight:bold}

.btn{transition:transform .15s,box-shadow .15s;cursor:pointer}
.btn:active{transform:scale(.95)}
.btn-disabled{opacity:.4;cursor:not-allowed}

.scroll-y{overflow-y:auto}
.scroll-y::-webkit-scrollbar{width:6px}
.scroll-y::-webkit-scrollbar-thumb{background:#fbcfe8;border-radius:3px}

/* 큰 글씨 - 저학년 가독성 (균형 조정) */
.text-mega{font-size:clamp(2rem,3.8vw,2.8rem);line-height:1.25}
.text-big{font-size:clamp(1.6rem,3vw,2.2rem);line-height:1.35}
.text-mid{font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.45}
.text-base-lg{font-size:clamp(1.05rem,2vw,1.3rem);line-height:1.5}

textarea{font-family:'Jua','Gaegu','Malgun Gothic',sans-serif}

/* 무드미터 사분면 (모달용) */
.mood-wrap{width:100%;height:100%;display:flex;flex-direction:column;min-height:0}
.mood-grid{
  display:grid;
  grid-template-columns:repeat(2, 1fr);
  gap:12px;
  width:100%;
  flex:1;
  min-height:0;
}
.mood-quad{
  transition:all .3s;
  border-radius:1.25rem;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
  position:relative;
  overflow:hidden;
  min-height:0;
}
.mood-quad.active{transform:scale(1.02);box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:5}
.mood-quad.dim{opacity:.45;filter:saturate(.5)}
.mood-red{background:linear-gradient(135deg,#fecaca 0%,#fca5a5 100%);border:4px solid #ef4444}
.mood-yellow{background:linear-gradient(135deg,#fef3c7 0%,#fde68a 100%);border:4px solid #f59e0b}
.mood-blue{background:linear-gradient(135deg,#dbeafe 0%,#bfdbfe 100%);border:4px solid #3b82f6}
.mood-green{background:linear-gradient(135deg,#d1fae5 0%,#a7f3d0 100%);border:4px solid #10b981}

.quad-header{display:flex;align-items:center;gap:8px;justify-content:center;margin-bottom:2px;flex-shrink:0}
.quad-icon{font-size:1.8rem}
.quad-title{font-size:1.5rem;font-weight:900;letter-spacing:-.5px}
.quad-sub{font-size:1rem;font-weight:bold;margin-bottom:8px;opacity:.88;text-align:center;white-space:nowrap;flex-shrink:0}

.quad-emotions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  justify-content:center;
  align-content:flex-start;
  width:100%;
  flex:1;
  min-height:0;
  overflow-y:auto;
}
.quad-emotions::-webkit-scrollbar{width:0}

.emotion-chip{
  background:rgba(255,255,255,.85);
  padding:5px 12px;
  border-radius:999px;
  font-size:1.05rem;
  font-weight:bold;
  color:#1e293b;
  white-space:nowrap;
  line-height:1.3;
}
.emotion-chip.highlight{
  background:white;
  color:#db2777;
  font-weight:900;
  font-size:1.3rem;
  padding:8px 18px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
  animation:pulse-emotion 1.2s ease-in-out infinite;
  transform:scale(1.05);
}
@keyframes pulse-emotion{0%,100%{transform:scale(1.05)}50%{transform:scale(1.12)}}

.mood-axis-x{text-align:center;font-size:1.1rem;font-weight:900;color:#475569;padding:6px 0;flex-shrink:0}
.mood-axis-y-wrap{display:flex;align-items:stretch;gap:8px;width:100%;flex:1;min-height:0}
.mood-axis-y{
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.1rem;
  font-weight:900;
  color:#475569;
  white-space:nowrap;
  flex-shrink:0;
  width:32px;
  text-align:center;
}
.mood-axis-y span{
  display:inline-block;
  transform:rotate(-90deg);
  transform-origin:center;
}
.mood-axis-y.right span{
  transform:rotate(90deg);
}

/* 모달 */
.modal-overlay{
  position:fixed;inset:0;
  background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;
  z-index:100;padding:16px;
  animation:fade-in .2s;
}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.modal-content{
  background:white;
  border-radius:2rem;
  width:100%;max-width:1100px;
  height:90vh;max-height:840px;
  display:flex;flex-direction:column;
  padding:20px;
  animation:pop-up .3s cubic-bezier(.34,1.56,.64,1);
}
@keyframes pop-up{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}

/* 사분면 색깔 배지 - 클릭 가능 강조 */
.quad-badge{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 26px;border-radius:999px;
  font-size:1.5rem;font-weight:900;
  border:4px solid;
  cursor:pointer;
  position:relative;
  box-shadow:0 6px 18px rgba(0,0,0,.15);
  animation:badge-bounce 2s ease-in-out infinite;
}
.quad-badge:hover{
  transform:translateY(-4px) scale(1.05);
  box-shadow:0 12px 28px rgba(0,0,0,.25);
}
.quad-badge:active{
  transform:translateY(-2px) scale(1.02);
}
.quad-badge::after{
  content:'';
  position:absolute;
  inset:-4px;
  border-radius:999px;
  border:4px solid currentColor;
  opacity:.4;
  animation:badge-ring 2s ease-out infinite;
  pointer-events:none;
}
@keyframes badge-bounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-4px)}
}
@keyframes badge-ring{
  0%{transform:scale(1);opacity:.5}
  100%{transform:scale(1.15);opacity:0}
}

.quad-badge-red{background:#fee2e2;color:#b91c1c;border-color:#ef4444}
.quad-badge-yellow{background:#fef3c7;color:#b45309;border-color:#f59e0b}
.quad-badge-blue{background:#dbeafe;color:#1d4ed8;border-color:#3b82f6}
.quad-badge-green{background:#d1fae5;color:#047857;border-color:#10b981}

/* 클릭 안내 텍스트 - 위에 떠있는 말풍선 */
.click-hint{
  position:relative;
  display:inline-block;
}
.click-hint::before{
  content:'👆 눌러보세요!';
  position:absolute;
  bottom:calc(100% + 8px);
  left:50%;
  transform:translateX(-50%);
  background:#1e293b;
  color:white;
  padding:6px 14px;
  border-radius:999px;
  font-size:.95rem;
  font-weight:bold;
  white-space:nowrap;
  animation:hint-bounce 1.5s ease-in-out infinite;
  z-index:1;
}
.click-hint::after{
  content:'';
  position:absolute;
  bottom:calc(100% + 2px);
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:8px solid transparent;
  border-right:8px solid transparent;
  border-top:8px solid #1e293b;
  animation:hint-bounce 1.5s ease-in-out infinite;
}
@keyframes hint-bounce{
  0%,100%{transform:translateX(-50%) translateY(0)}
  50%{transform:translateX(-50%) translateY(-4px)}
}
</style>

  try{
    const r = await fetch(`${GAS_URL}?action=${action}`,{redirect:'follow'});
    return JSON.parse(await r.text());
  }catch(_){return null}
};
const gasPost = async (data) => {
  try{
    await fetch(GAS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify(data)});

/* ── 효과음 (Web Audio API) ──────────── */
let audioCtx = null;
const getCtx = () => { if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); return audioCtx; };
const playTone = (freqs, duration=.15, type='sine', vol=.15) => {
  try{
    const ctx = getCtx();
    freqs.forEach((f,i)=>{
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      osc.type = type; osc.frequency.value = f;
      g.gain.value = 0;
      g.gain.linearRampToValueAtTime(vol, ctx.currentTime + i*duration + .01);
      g.gain.linearRampToValueAtTime(0, ctx.currentTime + (i+1)*duration);
      osc.connect(g); g.connect(ctx.destination);
      osc.start(ctx.currentTime + i*duration);
      osc.stop(ctx.currentTime + (i+1)*duration);
    });
  }catch(_){}
};
const sfx = {
  correct: (on) => on && playTone([523,659,784,1047],.1,'sine',.15),
  wrong:   (on) => on && playTone([400,300],.18,'sine',.1),
  click:   (on) => on && playTone([800],.05,'sine',.08),
  win:     (on) => on && playTone([523,659,784,1047,1319],.12,'sine',.18),
  star:    (on) => on && playTone([1047,1319,1568],.1,'triangle',.12),
};

/* ── 자연스러운 한국어 여성 음성 우선 ──────── */
let cachedVoice = null;
const getKoVoice = () => {
  if(cachedVoice) return cachedVoice;
  const voices = window.speechSynthesis.getVoices();
  if(!voices || voices.length === 0) return null;
  let v = voices.find(x => x.lang === 'ko-KR' && x.name.toLowerCase().includes('google') && !x.localService);
  if(!v) v = voices.find(x => x.lang === 'ko-KR' && /wavenet|neural/i.test(x.name) && /-a/i.test(x.name));
  if(!v) v = voices.find(x => x.lang === 'ko-KR' && /wavenet|neural/i.test(x.name));
  if(!v) v = voices.find(x => x.lang === 'ko-KR' && /premium|enhanced|natural/i.test(x.name));
  if(!v) v = voices.find(x => x.lang === 'ko-KR' && /yuna|heami|hyemi|유나|혜미/i.test(x.name));
  if(!v) v = voices.find(x => x.lang === 'ko-KR');
  cachedVoice = v;
  return v;
};

const speak = (text, on, onWord=null, onEnd=null) => {
  if(!on || !window.speechSynthesis) { onEnd && onEnd(); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.95;
  u.pitch = 1.1;
  u.volume = 1.0;
  const v = getKoVoice();
  if(v) u.voice = v;
  if(onWord) u.onboundary = (e) => { if(e.name === 'word' || e.name === 'sentence') onWord(e.charIndex); };
  if(onEnd) u.onend = onEnd;
  window.speechSynthesis.speak(u);
};

/* ── 수료증 + 배움기록표 통합 PNG ─────────── */
const downloadCertificate = (name, learned, stars, history, selfSticker) => {
  const cv = document.createElement('canvas');
  cv.width = 1200; cv.height = 1700;
  const ctx = cv.getContext('2d');

  // roundRect 폴리필
  if(!ctx.roundRect){
    ctx.roundRect = function(x, y, w, h, r){
      if(typeof r === 'number') r = [r,r,r,r];
      this.beginPath();
      this.moveTo(x+r[0], y);
      this.lineTo(x+w-r[1], y);
      this.quadraticCurveTo(x+w, y, x+w, y+r[1]);
      this.lineTo(x+w, y+h-r[2]);
      this.quadraticCurveTo(x+w, y+h, x+w-r[2], y+h);
      this.lineTo(x+r[3], y+h);
      this.quadraticCurveTo(x, y+h, x, y+h-r[3]);
      this.lineTo(x, y+r[0]);
      this.quadraticCurveTo(x, y, x+r[0], y);
      this.closePath();
      return this;
    };
  }

  ctx.fillStyle = '#fffcf4'; ctx.fillRect(0, 0, 1200, 1700);
  ctx.strokeStyle = '#f472b6'; ctx.lineWidth = 30; ctx.strokeRect(30, 30, 1140, 1640);
  ctx.strokeStyle = '#fce7f3'; ctx.lineWidth = 10; ctx.strokeRect(60, 60, 1080, 1580);

  ctx.textAlign = 'center';

  // 상단 상장
  ctx.font = 'bold 90px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#db2777';
  ctx.fillText('🏆 감정 알기 대장 상장 🏆', 600, 180);

  ctx.font = 'bold 50px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#1e293b';
  ctx.fillText('감정 알기 대모험 대장정', 600, 260);

  ctx.font = '900 80px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#db2777';
  ctx.fillText(`${name||'친구'} 어린이`, 600, 380);

  ctx.font = '40px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#475569';
  ['위 어린이는 용기 있게 마음의 보물을 찾아', '자신의 감정을 바르게 표현하는 힘을 길렀기에', '이 상장을 수여하며 칭찬합니다.'].forEach((l, i) => ctx.fillText(l, 600, 460 + i * 60));

  const safeStars = Math.max(0, Math.min(5, Number(stars) || 0));
  ctx.font = '70px serif';
  ctx.fillStyle = '#f59e0b';
  ctx.fillText('⭐'.repeat(safeStars) + '☆'.repeat(5 - safeStars), 600, 720);

  if (selfSticker) {
    ctx.font = 'bold 36px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = '#db2777';
    ctx.fillText(`"${selfSticker}"`, 600, 780);
  }

  ctx.strokeStyle = '#fbcfe8';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(150, 830);
  ctx.lineTo(1050, 830);
  ctx.stroke();

  // 하단 배움기록표
  ctx.font = 'bold 56px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#7c3aed';
  ctx.fillText('📋 오늘의 배움 기록표', 600, 910);

  const safeHistory = Array.isArray(history) ? history : [];
  const safeLearned = Array.isArray(learned) ? learned : [];
  const correctCnt = safeHistory.filter(h => h && h.ok).length;
  const totalCnt = safeHistory.length;
  const learnedCnt = safeLearned.length;
  const accuracy = totalCnt > 0 ? Math.round(correctCnt / totalCnt * 100) : 0;

  const stats = [
    {label: '풀어본 문제', val: `${totalCnt}개`, color: '#fce7f3'},
    {label: '맞힌 문제', val: `${correctCnt}개`, color: '#d1fae5'},
    {label: '정답률', val: `${accuracy}%`, color: '#dbeafe'},
    {label: '배운 감정', val: `${learnedCnt}개`, color: '#fef3c7'},
  ];
  const boxW = 230, boxH = 130, gap = 20, startX = 90;
  stats.forEach((s, i) => {
    const x = startX + i * (boxW + gap);
    ctx.fillStyle = s.color;
    ctx.beginPath();
    ctx.roundRect(x, 960, boxW, boxH, 16);
    ctx.fill();

    ctx.font = 'bold 26px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = '#64748b';
    ctx.fillText(s.label, x + boxW / 2, 1000);

    ctx.font = 'bold 48px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = '#1e293b';
    ctx.fillText(s.val, x + boxW / 2, 1060);
  });

  ctx.font = 'bold 36px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#7c3aed';
  ctx.fillText('✨ 오늘 배운 감정', 600, 1170);

  if (safeLearned.length > 0) {
    ctx.font = 'bold 32px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = '#db2777';
    const lines = [];
    for (let i = 0; i < safeLearned.length; i += 5) {
      lines.push(safeLearned.slice(i, i + 5).join(' · '));
    }
    lines.slice(0, 3).forEach((line, i) => ctx.fillText(line, 600, 1220 + i * 50));
  } else {
    ctx.font = '28px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
    ctx.fillStyle = '#94a3b8';
    ctx.fillText('(아직 없어요)', 600, 1220);
  }

  ctx.font = 'bold 30px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#475569';
  ctx.fillText('🎯 문제 풀이 결과', 600, 1430);

  const dotR = 18, dotGap = 12;
  const showCnt = Math.min(safeHistory.length, 15);
  if(showCnt > 0){
    const totalW = showCnt * (dotR * 2 + dotGap) - dotGap;
    let dotX = 600 - totalW / 2;
    safeHistory.slice(0, 15).forEach((h, i) => {
      ctx.beginPath();
      ctx.arc(dotX + dotR, 1490, dotR, 0, Math.PI * 2);
      ctx.fillStyle = h && h.ok ? '#10b981' : '#f59e0b';
      ctx.fill();
      ctx.font = 'bold 22px sans-serif';
      ctx.fillStyle = 'white';
      ctx.fillText(h && h.ok ? '○' : '△', dotX + dotR, 1498);
      dotX += dotR * 2 + dotGap;
    });
    if (safeHistory.length > 15) {
      ctx.font = '20px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`+ 외 ${safeHistory.length - 15}개`, 600, 1545);
    }
  }

  ctx.font = 'bold 32px "Apple SD Gothic Neo","Malgun Gothic",sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.fillText(new Date().toLocaleDateString('ko-KR'), 600, 1610);
  ctx.fillText('감정 알기 요정 드림 🧚', 600, 1650);

  const a = document.createElement('a');
  a.download = `상장_배움기록표_${name || '친구'}.png`;
  a.href = cv.toDataURL('image/png');
  a.click();
};
</script>

<body>
<div id="root"><div id="app"></div></div>

<script type="text/babel">
const {useState,useEffect,useRef,useCallback} = React;

/* 헤더 */
const Header = ({label, soundOn, toggleSound}) => (
  <div className="flex items-center justify-between px-5 py-3 shrink-0">
    <div className="flex items-center gap-2">
      <button onClick={()=>{if(confirm('처음으로 돌아갈까요?'))window.location.reload()}}
        className="btn flex items-center justify-center w-11 h-11 bg-white rounded-2xl border-2 border-slate-100 text-slate-400 shadow-sm text-2xl">
        🏠
      </button>
      <span className="text-base font-black text-slate-500 bg-white px-4 py-2 rounded-full border-2 border-slate-100 shadow-sm">
        {label}
      </span>
    </div>
    <button onClick={toggleSound}
      className={`btn w-12 h-12 rounded-2xl border-2 shadow-sm text-2xl ${soundOn?'bg-pink-100 text-pink-500 border-pink-300':'bg-white text-slate-300 border-slate-200'}`}>
      {soundOn?'🔊':'🔇'}
    </button>
  </div>
);

/* 마스코트 */
const Mascot = ({size=90}) => (
  <svg width={size} height={size*1.2} viewBox="0 0 100 120" fill="none">
    <circle cx="50" cy="70" r="38" fill="white" stroke="#f472b6" strokeWidth="4.5"/>
    <path d="M34 20 L36 43" stroke="#f472b6" strokeWidth="9" strokeLinecap="round"/>
    <path d="M66 20 L64 43" stroke="#f472b6" strokeWidth="9" strokeLinecap="round"/>
    <circle cx="40" cy="68" r="3.5" fill="#1e293b"/>
    <circle cx="60" cy="68" r="3.5" fill="#1e293b"/>
    <path d="M43 85 Q50 92 57 85" stroke="#f472b6" strokeWidth="2.5" strokeLinecap="round"/>
  </svg>
);

/* 칭찬 스티커 폭발 */
const StickerBurst = ({trigger}) => {
  const [stickers, setStickers] = useState([]);
  useEffect(() => {
    if(!trigger) return;
    const emojis = ['⭐','💖','🌸','✨','🌟','💫','🏵️','🎀'];
    const newStickers = Array.from({length:12}).map((_,i)=>({
      id: Date.now()+i,
      emoji: emojis[Math.floor(Math.random()*emojis.length)],
      tx: (Math.random()-0.5)*400,
      ty: -100 - Math.random()*200,
      delay: Math.random()*0.3,
    }));
    setStickers(newStickers);
    setTimeout(()=>setStickers([]), 2200);
  }, [trigger]);
  return (
    <div className="absolute inset-0 pointer-events-none flex items-center justify-center z-30">
      {stickers.map(s => (
        <span key={s.id} className="sticker-fly"
          style={{'--tx':`${s.tx}px`,'--ty':`${s.ty}px`,animationDelay:`${s.delay}s`}}>
          {s.emoji}
        </span>
      ))}
    </div>
  );
};

/* 글자 하이라이트 */
const HighlightedText = ({text, highlightIdx, className=""}) => {
  if(highlightIdx < 0) return <span className={className}>{text}</span>;
  const before = text.slice(0, highlightIdx);
  const rest = text.slice(highlightIdx);
  const wordEnd = rest.search(/[\s.,!?]/);
  const word = wordEnd > 0 ? rest.slice(0, wordEnd) : rest;
  const after = wordEnd > 0 ? rest.slice(wordEnd) : '';
  return (
    <span className={className}>
      {before}<span className="tts-highlight">{word}</span>{after}
    </span>
  );
};

/* 무드미터 (모달 내부용) */
const MoodMeter = ({activeQuad, emotion, allEmotions}) => {
  const grouped = {red:[], yellow:[], blue:[], green:[]};
  (allEmotions || []).forEach(e => {
    if(grouped[e.quad]) grouped[e.quad].push(e);
  });

  const renderQuad = (quadKey, title, subtitle, icon, textColor) => {
    const emotions = grouped[quadKey] || [];
    let display = [...emotions];
    if(emotion && emotion.quad === quadKey){
      display = [emotion, ...emotions.filter(e => e.id !== emotion.id)];
    }

    const isActive = activeQuad === quadKey;
    const isDim = activeQuad && activeQuad !== quadKey;

    return (
      <div className={`mood-quad mood-${quadKey} ${isActive?'active':''} ${isDim?'dim':''}`}>
        <div className="quad-header" style={{color: textColor}}>
          <span className="quad-icon">{icon}</span>
          <span className="quad-title">{title}</span>
        </div>
        <div className="quad-sub" style={{color: textColor}}>{subtitle}</div>
        <div className="quad-emotions">
          {display.map((em) => (
            <span key={em.id} className={`emotion-chip ${emotion && em.id === emotion.id ? 'highlight' : ''}`}>
              {em.emoji} {em.id}
            </span>
          ))}
        </div>
      </div>
    );
  };

  return (
    <div className="mood-wrap">
      <div className="mood-axis-x">⬆️ 활기참 (에너지 높음)</div>
      <div className="mood-axis-y-wrap">
        <div className="mood-axis-y left"><span>⬅️ 힘듦</span></div>
        <div className="mood-grid flex-1">
          {renderQuad('red',    '활기찬 힘듦',     '화나고 무서운 마음',   '🔥', '#b91c1c')}
          {renderQuad('yellow', '활기찬 즐거움',   '신나고 기쁜 마음',     '☀️', '#b45309')}
          {renderQuad('blue',   '잔잔한 힘듦',     '슬프고 외로운 마음',   '💧', '#1d4ed8')}
          {renderQuad('green',  '잔잔한 평온',     '편안하고 따뜻한 마음', '🌿', '#047857')}
        </div>
        <div className="mood-axis-y right"><span>유쾌 ➡️</span></div>
      </div>
      <div className="mood-axis-x">⬇️ 잔잔함 (에너지 낮음)</div>
    </div>
  );
};

/* 무드미터 모달 */
const MoodModal = ({open, onClose, activeQuad, emotion, allEmotions, soundOn}) => {
  if(!open) return null;
  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal-content" onClick={e=>e.stopPropagation()}>
        <div className="flex items-center justify-between mb-3 shrink-0">
          <h3 className="text-big font-black text-slate-800">🗺️ 마음 지도</h3>
          <button onClick={()=>{sfx.click(soundOn); onClose()}}
            className="btn w-12 h-12 bg-slate-100 hover:bg-slate-200 rounded-2xl text-2xl font-black text-slate-600">
            ✕
          </button>
        </div>
        <div className="flex-1 min-h-0">
          <MoodMeter activeQuad={activeQuad} emotion={emotion} allEmotions={allEmotions}/>
        </div>
        <button onClick={()=>{sfx.click(soundOn); onClose()}}
          className="shrink-0 mt-4 btn w-full py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-big shadow-lg">
          알았어요! ✨
        </button>
      </div>
    </div>
  );
};

/* 🎙️ 녹음 + STT + 키보드 */
const VoiceRecorder = ({prompt, example, onComplete, soundOn, color='pink'}) => {
  const [mode, setMode] = useState('idle');
  const [transcript, setTranscript] = useState('');
  const [textInput, setTextInput] = useState('');
  const [audioUrl, setAudioUrl] = useState(null);
  const [audioB64, setAudioB64] = useState(null);
  const [interimText, setInterimText] = useState('');
  const [recDuration, setRecDuration] = useState(0);

  const mrRef = useRef(null);
  const chunksRef = useRef([]);
  const recRef = useRef(null);
  const timerRef = useRef(null);

  const colorMap = {
    pink: {bg:'bg-pink-500',hover:'hover:bg-pink-600',light:'bg-pink-50',border:'border-pink-200',text:'text-pink-600'},
    indigo: {bg:'bg-indigo-500',hover:'hover:bg-indigo-600',light:'bg-indigo-50',border:'border-indigo-200',text:'text-indigo-600'},
    emerald: {bg:'bg-emerald-500',hover:'hover:bg-emerald-600',light:'bg-emerald-50',border:'border-emerald-200',text:'text-emerald-600'},
  };
  const c = colorMap[color] || colorMap.pink;

  const startRec = async () => {
    sfx.click(soundOn);
    try {
      const stream = window.__permStream;
      const isStreamActive = stream && stream.getAudioTracks().some(t=>t.readyState==='live');
      const activeStream = isStreamActive ? stream : await navigator.mediaDevices.getUserMedia({audio:true});
      window.__permStream = activeStream;

      let mimeType = 'audio/webm';
      if(!MediaRecorder.isTypeSupported(mimeType)){
        if(MediaRecorder.isTypeSupported('audio/mp4')) mimeType = 'audio/mp4';
        else mimeType = '';
      }
      const mr = mimeType ? new MediaRecorder(activeStream, {mimeType}) : new MediaRecorder(activeStream);
      mrRef.current = mr;
      chunksRef.current = [];
      mr.ondataavailable = e => { if(e.data.size>0) chunksRef.current.push(e.data); };
      mr.onstop = () => {
        const blob = new Blob(chunksRef.current,{type: mimeType || 'audio/webm'});
        setAudioUrl(URL.createObjectURL(blob));
        const fr = new FileReader();
        fr.readAsDataURL(blob);
        fr.onloadend = () => {
          const result = fr.result || '';
          const commaIdx = result.indexOf(',');
          if(commaIdx > 0) setAudioB64(result.slice(commaIdx+1));
        };
      };
      mr.start();

      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if(SR){
        try {
          const rec = new SR();
          rec.lang = 'ko-KR';
          rec.continuous = true;
          rec.interimResults = true;
          let finalText = '';
          rec.onresult = (e) => {
            let interim = '';
            for(let i=e.resultIndex; i<e.results.length; i++){
              if(e.results[i].isFinal) finalText += e.results[i][0].transcript;
              else interim += e.results[i][0].transcript;
            }
            setTranscript(finalText);
            setInterimText(interim);
          };
          rec.onerror = (e) => { console.log('STT:', e.error); };
          rec.start();
          recRef.current = rec;
        } catch(_){}
      }

      setMode('recording');
      setRecDuration(0);
      timerRef.current = setInterval(()=>setRecDuration(d=>d+1), 1000);
    } catch(err) {
      alert('마이크를 사용할 수 없어요. 키보드로 입력해주세요!');
    }
  };

  const stopRec = () => {
    sfx.click(soundOn);
    if(mrRef.current && mrRef.current.state !== 'inactive') mrRef.current.stop();
    if(recRef.current){ try{recRef.current.stop()}catch(_){} }
    if(timerRef.current) clearInterval(timerRef.current);
    setMode('done');
    setInterimText('');
  };

  const reset = () => {
    sfx.click(soundOn);
    setMode('idle'); setTranscript(''); setTextInput('');
    setAudioUrl(null); setAudioB64(null); setRecDuration(0);
  };

  const submit = () => {
    sfx.star(soundOn);
    const finalText = transcript || textInput;
    if(!finalText.trim() && !audioB64){
      alert('내용을 말하거나 적어주세요!'); return;
    }
    onComplete({ text: finalText.trim(), audioBase64: audioB64 });
  };

  useEffect(()=>{
    return () => {
      if(timerRef.current) clearInterval(timerRef.current);
      if(recRef.current){ try{recRef.current.stop()}catch(_){} }
    };
  },[]);

  return (
    <div className={`card card-${color==='emerald'?'emerald':color} w-full max-w-2xl p-5`}>
      <p className={`text-mid font-black ${c.text} mb-2 text-center word-keep`}>{prompt}</p>
      {example && <div className={`${c.light} border-2 ${c.border} rounded-2xl p-3 mb-4`}>
        <p className="text-base-lg font-bold text-slate-400 mb-1">📝 예시</p>
        <p className="text-base-lg font-bold text-slate-700">"{example}"</p>
      </div>}

      {mode === 'idle' && (
        <div className="space-y-3">
          <button onClick={startRec}
            className={`btn w-full py-4 ${c.bg} ${c.hover} text-white rounded-2xl font-black text-mid shadow-lg flex items-center justify-center gap-3 whitespace-nowrap`}>
            🎙️ 말하기로 시작!
          </button>
          <div className="flex items-center gap-3">
            <div className="flex-1 h-px bg-slate-200"/>
            <span className="text-base-lg font-bold text-slate-400">또는</span>
            <div className="flex-1 h-px bg-slate-200"/>
          </div>
          <textarea value={textInput} onChange={e=>setTextInput(e.target.value)}
            placeholder="여기에 직접 적어도 좋아요!"
            className="w-full p-3 bg-slate-50 border-2 border-slate-200 rounded-2xl text-base-lg font-bold focus:outline-none focus:border-pink-300 resize-none"
            rows="2"/>
          <button onClick={submit} disabled={!textInput.trim()}
            className={`btn w-full py-3 ${textInput.trim() ? 'bg-slate-700 hover:bg-slate-800 text-white' : 'bg-slate-200 text-slate-400 btn-disabled'} rounded-2xl font-black text-mid shadow-md whitespace-nowrap`}>
            ⌨️ 적은 내용 제출하기
          </button>
        </div>
      )}

      {mode === 'recording' && (
        <div className="space-y-3">
          <div className="relative bg-rose-50 border-2 border-rose-200 rounded-2xl p-4 min-h-[90px]">
            <div className="absolute top-3 right-4 flex items-center gap-2">
              <span className="relative flex h-3 w-3">
                <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-rose-400 opacity-75"/>
                <span className="relative inline-flex rounded-full h-3 w-3 bg-rose-500"/>
              </span>
              <span className="text-base-lg font-black text-rose-500">{recDuration}초</span>
            </div>
            <p className="text-base-lg font-black text-rose-400 mb-2">🎙️ 듣고 있어요...</p>
            <p className="text-base-lg font-bold text-slate-700 leading-relaxed">
              {transcript}
              <span className="text-slate-400">{interimText}</span>
              {!transcript && !interimText && <span className="text-slate-300 italic">말하는 내용이 여기에 표시돼요!</span>}
            </p>
          </div>
          <button onClick={stopRec}
            className="btn w-full py-4 bg-slate-800 hover:bg-slate-900 text-white rounded-2xl font-black text-mid shadow-lg whitespace-nowrap">
            ⏹ 다 말했어요!
          </button>
        </div>
      )}

      {mode === 'done' && (
        <div className="space-y-3">
          <div className={`${c.light} border-2 ${c.border} rounded-2xl p-3`}>
            <p className="text-base-lg font-black text-emerald-600 mb-2">✅ 들은 내용</p>
            <textarea value={transcript || textInput} onChange={e=>setTranscript(e.target.value)}
              placeholder="고치고 싶으면 직접 수정해도 돼요!"
              className="w-full p-3 bg-white border border-slate-200 rounded-xl text-base-lg font-bold focus:outline-none focus:border-pink-300 resize-none"
              rows="2"/>
          </div>
          {audioUrl && <audio controls src={audioUrl} className="w-full rounded-xl"/>}
          <div className="flex gap-3">
            <button onClick={reset}
              className="btn flex-1 py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-black text-base-lg whitespace-nowrap">
              🔄 다시
            </button>
            <button onClick={submit}
              className={`btn flex-[2] py-3 ${c.bg} ${c.hover} text-white rounded-2xl font-black text-mid shadow-lg whitespace-nowrap`}>
              제출하기 🏆
            </button>
          </div>
        </div>
      )}
    </div>
  );
};

/* ══════════════════════════════════════════════════════
   App 본체
══════════════════════════════════════════════════════ */
const App = () => {
  const [phase, setPhase] = useState('mic_check');
  const [students, setStudents] = useState(SAMPLES);
  const [student, setStudent] = useState(SAMPLES[0]);
  const [soundOn, setSoundOn] = useState(false);

  const [emotionData, setEmotionData] = useState(EMOTION_DB);
  const [quizData, setQuizData] = useState(QUIZ_Q);

  const [startEmotion, setStartEmotion] = useState({text:'', audioBase64:null});
  const [endResolution, setEndResolution] = useState({text:'', audioBase64:null});

  const [conceptList, setConceptList] = useState([]);
  const [conceptIdx, setConceptIdx] = useState(0);
  const [highlightIdx, setHighlightIdx] = useState(-1);

  const [qs, setQs] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [fb, setFb] = useState(null);
  const [wrong, setWrong] = useState([]);
  const [history, setHistory] = useState([]);
  const [reviewMode, setReviewMode] = useState(false);
  const [stickerTrigger, setStickerTrigger] = useState(0);

  const [stars, setStars] = useState(0);
  const [retryCount, setRetryCount] = useState(0);
  const [selfSticker, setSelfSticker] = useState(null);

  const [saving, setSaving] = useState(false);
  const [saved, setSaved] = useState(false);

  // 무드미터 모달
  const [moodModal, setMoodModal] = useState(null);
  const openMoodModal = (quad, em) => {
    sfx.click(soundOn);
    setMoodModal({quad, emotion: em});
  };
  const closeMoodModal = () => setMoodModal(null);

  useEffect(() => { setMoodModal(null); }, [phase]);

  /* 데이터 로드 */
  useEffect(() => {
    const init = async () => {
      try {
        const names = await gasGet('getStudentList');
        if(Array.isArray(names) && names.length > 0){ setStudents(names); setStudent(names[0]); }
      } catch(_) {}
      try {
        const emos = await gasGet('getEmotionData');
        if(Array.isArray(emos) && emos.length > 0){
          const mapped = emos.map(e => ({
            id: e.word || e.id,
            quad: (e.quad || 'yellow').toLowerCase(),
            cat: (e.cat || 'pos').toLowerCase() === 'neg' ? 'neg' : 'pos',
            emoji: e.emoji || '✨',
            desc: e.desc || '',
            sit: e.sit1 || e.sit || '',
          }));
          setEmotionData(mapped);
        }
      } catch(_) {}
      try {
        const qzs = await gasGet('getQuizData');
        if(Array.isArray(qzs) && qzs.length > 0){
          const mapped = qzs.map(q => ({...q, opts: q.opts || []}));
          setQuizData(mapped);
        }
      } catch(_) {}
    };
    init();
    if(window.speechSynthesis){
      window.speechSynthesis.getVoices();
      window.speechSynthesis.onvoiceschanged = () => { cachedVoice = null; getKoVoice(); };
    }
  }, []);

  /* 마이크 권한 */
  const requestMic = async () => {
    sfx.click(soundOn);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      window.__permStream = stream;
      setPhase('start');
    } catch(_) {
      alert('마이크 권한이 필요해요! 키보드로도 입력 가능하니 계속 진행할게요.');
      setPhase('start');
    }
  };

  /* TTS 자동 읽기 */
  useEffect(() => {
    if(!soundOn) { setHighlightIdx(-1); return; }
    let text = '';
    if(phase === 'intro') text = '오늘의 약속! 나는 내 감정을 당당하게 말해요!';
    else if(phase === 'mood_intro') text = '우리 마음에는 네 가지 색깔이 있어요. 함께 알아볼까요?';
    else if(phase === 'concept' && conceptList.length > 0){
      const em = conceptList[conceptIdx];
      if(em) text = `${em.sit}. 이럴 때 느끼는 감정은 ${em.id}예요. ${em.desc}`;
    }
    else if(phase === 'activity'){
      const list = reviewMode ? wrong : qs;
      const q = list[qIdx];
      if(q) text = q.q;
    }
    else if(phase === 'self_rating') text = '오늘 공부 어땠나요? 별표를 눌러 알려줘요!';
    else if(phase === 'start_voice') text = '오늘 나의 마음은 어떤가요?';
    else if(phase === 'end_voice') text = '오늘 배운 것을 떠올리며 다짐을 말해보세요!';
    else if(phase === 'self_praise') text = '내 다짐을 들어보고 스스로 칭찬해줘요!';

    if(text){
      setHighlightIdx(0);
      speak(text, true,
        (charIdx) => setHighlightIdx(charIdx),
        () => setHighlightIdx(-1)
      );
    }
  }, [phase, conceptIdx, qIdx, soundOn, reviewMode]);

  /* 안전장치 */
  useEffect(() => {
    if(phase === 'concept' && conceptList.length > 0 && conceptIdx >= conceptList.length){
      setPhase('activity');
    }
  }, [phase, conceptList, conceptIdx]);

  useEffect(() => {
    if(phase === 'activity'){
      const list = reviewMode ? wrong : qs;
      if(list.length === 0) setPhase('self_rating');
    }
  }, [phase, reviewMode, wrong, qs]);

  useEffect(() => {
    if(phase === 'concept' && conceptList.length === 0){
      setPhase('activity');
    }
  }, [phase, conceptList]);

  /* 레벨 선택 */
  const handleLevel = useCallback((count) => {
    sfx.click(soundOn);
    const shuffled = [...quizData].sort(()=>Math.random()-.5)
      .slice(0, Math.min(count, quizData.length))
      .map(q => ({...q, opts: [...q.opts].sort(()=>Math.random()-.5)}));
    setQs(shuffled);

    const byQuad = {red:[],yellow:[],blue:[],green:[]};
    emotionData.forEach(e => { if(byQuad[e.quad]) byQuad[e.quad].push(e); });
    const concepts = [];
    ['yellow','red','blue','green'].forEach(q => {
      const list = byQuad[q].sort(()=>Math.random()-.5);
      if(list[0]) concepts.push(list[0]);
    });
    while(concepts.length < 4 && concepts.length < emotionData.length){
      const fill = emotionData.find(e => !concepts.find(c => c.id === e.id));
      if(fill) concepts.push(fill); else break;
    }
    setConceptList(concepts);

    setQIdx(0); setFb(null); setWrong([]); setHistory([]);
    setReviewMode(false);
    setStars(0); setSaved(false); setSelfSticker(null);
    setPhase('mood_intro');
    setConceptIdx(0);
  }, [quizData, emotionData, soundOn]);

  /* 퀴즈 정답/오답 */
  const checkAns = useCallback((ua) => {
    const list = reviewMode ? wrong : qs;
    const q = list[qIdx];
    const ok = ua === q.a;
    if(!reviewMode) setHistory(h => [...h, {id: q.id, q: q.q, a: q.a, ok, concept: q.a, picked: ua}]);
    if(ok){
      sfx.correct(soundOn);
      setFb({ok:true, msg:q.fb, picked: ua});
      setStickerTrigger(t=>t+1);
      if(reviewMode) setWrong(w => w.filter(x => x.id !== q.id));
      confetti({particleCount:80, spread:55, origin:{y:.65}});
    } else {
      sfx.wrong(soundOn);
      setFb({ok:false, msg: q.wfb || `다시 한번 생각해봐요. 답은 "${q.a}" 같은 마음일 거예요!`, picked: ua});
      if(!wrong.find(x=>x.id===q.id)) setWrong(w => [...w, q]);
    }
  }, [reviewMode, wrong, qs, qIdx, soundOn]);

  const nextQ = useCallback(() => {
    sfx.click(soundOn);
    const list = reviewMode ? wrong : qs;
    setFb(null);
    if(qIdx < list.length-1) setQIdx(q => q+1);
    else if(reviewMode || wrong.length === 0) setPhase('self_rating');
    else setPhase('retry_intro');
  }, [reviewMode, wrong, qs, qIdx, soundOn]);

  const handleStartVoiceComplete = (data) => { setStartEmotion(data); setPhase('intro'); };
  const handleEndVoiceComplete = (data) => { setEndResolution(data); setPhase('self_praise'); };

  const handleStarSubmit = () => {
    sfx.star(soundOn);
    if(stars <= 3 && retryCount === 0) setPhase('low_star_retry');
    else setPhase('end_voice');
  };

  const doRetry = () => {
    sfx.click(soundOn);
    setRetryCount(c=>c+1);
    handleLevel(qs.length);
  };

  const saveResult = async () => {
    if(saved){ setPhase('report'); return; }
    setSaving(true); setSaved(true);
    const learned = [...new Set(history.filter(h=>h.ok).map(h=>h.concept))];
    const payload = {
      name: student,
      total: qs.length,
      correct: history.filter(h=>h.ok).length,
      emotions: learned,
      rating: stars,
      retryCount: retryCount,
      startText: startEmotion.text,
      startAudio: startEmotion.audioBase64,
      endText: endResolution.text,
      endAudio: endResolution.audioBase64,
      selfSticker: selfSticker,
    };
    await gasPost(payload);
    setSaving(false);
    setPhase('report');
  };

  const toggleSound = () => {
    setSoundOn(s => !s);
    if(soundOn) window.speechSynthesis.cancel();
  };

  /* ══════ 렌더링 ══════ */

  /* 마이크 권한 */
  if(phase === 'mic_check') return (
    <div className="w-full h-full flex flex-col items-center justify-center p-8 relative overflow-hidden">
      <Mascot size={100}/>
      <h1 className="text-mega font-black text-slate-900 mt-4 mb-3 tracking-tight text-center">
        감정 알기 <span className="text-pink-500">대모험</span> ✨
      </h1>
      <div className="card card-pink p-8 max-w-md text-center mt-6">
        <div className="text-7xl mb-4 float">🎙️</div>
        <p className="text-big font-black text-slate-700 mb-3">마이크 준비하기</p>
        <p className="text-mid font-bold text-slate-500 mb-6 word-keep">
          내 마음을 목소리로 들려주려면<br/>마이크가 필요해요!
        </p>
        <button onClick={requestMic}
          className="btn w-full py-5 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-black text-big shadow-lg">
          🎙️ 마이크 허용하기
        </button>
      </div>
    </div>
  );

  /* 시작 화면 */
  if(phase === 'start') return (
    <div className="w-full h-full flex flex-col items-center justify-center p-6 relative overflow-hidden">
      <div className="absolute top-8 left-8 text-7xl opacity-10 float">🍭</div>
      <div className="absolute bottom-16 right-8 text-8xl opacity-10 float" style={{animationDelay:'.8s'}}>🌈</div>
      <Mascot size={110}/>
      <h1 className="text-mega font-black text-slate-900 mt-4 mb-2 tracking-tight">
        감정 알기 <span className="text-pink-500">대모험</span> ✨
      </h1>
      <p className="text-mid font-bold text-slate-400 mb-6">내 마음 속 반짝이는 보물을 찾아요!</p>

      <div className="card card-pink w-full max-w-md p-7 shadow-xl">
        <p className="text-center text-base-lg font-black text-pink-400 tracking-widest mb-3">내 이름을 선택해요</p>
        <select value={student} onChange={e=>setStudent(e.target.value)}
          className="w-full p-4 mb-5 bg-slate-50 border-2 border-slate-100 rounded-2xl text-big font-black text-slate-800 text-center focus:outline-none focus:border-pink-300">
          {students.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <button onClick={()=>{sfx.click(soundOn); setPhase('start_voice')}}
          className="btn w-full py-5 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-black text-big shadow-lg">
          시작하기 ▶
        </button>

        <div className="mt-4 bg-slate-50 border-2 border-slate-200 rounded-2xl p-3 flex items-center justify-between">
          <div>
            <p className="text-base-lg font-black text-slate-600">🔊 소리 듣기</p>
            <p className="text-sm font-bold text-slate-400">{soundOn?'문제를 읽어줘요':'한글을 잘 못 읽으면 켜요'}</p>
          </div>
          <button onClick={toggleSound}
            className={`btn px-4 py-2 rounded-full font-black text-base-lg border-2 ${soundOn?'bg-pink-100 text-pink-600 border-pink-300':'bg-white text-slate-500 border-slate-300'}`}>
            {soundOn?'🔊 켜짐':'🔇 꺼짐'}
          </button>
        </div>
      </div>
    </div>
  );

  /* 시작 감정 녹음 */
  if(phase === 'start_voice') return (
    <div className="w-full h-full flex flex-col" style={{background:'#fffaf5'}}>
      <Header label="🌅 오늘 나의 마음은?" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center px-5 pb-3 overflow-hidden">
        <div className="text-5xl mb-2 float">🌟</div>
        <h2 className="text-big font-black text-slate-800 mb-3 text-center">
          {soundOn ? <HighlightedText text="오늘 나의 마음은 어떤가요?" highlightIdx={highlightIdx}/> : '오늘 나의 마음은 어떤가요?'}
        </h2>
        <VoiceRecorder
          prompt="🎙️ 지금 내 마음을 말해보세요!"
          example="오늘은 친구를 만나서 반가워요!"
          onComplete={handleStartVoiceComplete}
          soundOn={soundOn}
          color="pink"
        />
        <button onClick={()=>{sfx.click(soundOn); setStartEmotion({text:'',audioBase64:null}); setPhase('intro')}}
          className="mt-2 text-slate-300 hover:text-slate-500 underline font-bold text-base-lg shrink-0">
          말하기가 쑥스러우면 넘어가도 돼요
        </button>
      </div>
    </div>
  );

  /* 인트로 */
  if(phase === 'intro') return (
    <div className="w-full h-full flex flex-col" style={{background:'#fff9fa'}}>
      <Header label="🌸 오늘의 약속" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center text-center px-8">
        <div className="inline-block bg-pink-100 text-pink-600 font-black text-base-lg px-4 py-2 rounded-full mb-5">🌱 우리의 약속</div>
        <h2 className="text-mega font-black text-slate-800 mb-6 leading-snug">
          {soundOn ? <HighlightedText text='"나는 내 감정을 당당하게 말해요!"' highlightIdx={highlightIdx}/> : '"나는 내 감정을 당당하게 말해요!"'}
        </h2>
        <div className="card card-pink p-7 max-w-lg mb-8 text-mid font-bold text-slate-500 leading-relaxed word-keep italic">
          기쁠 때는 웃고, 슬플 때는 말하고,<br/>어려울 때는 도움을 청하는<br/>용기 있는 어린이가 될래요!
        </div>
        <button onClick={()=>{sfx.click(soundOn); setPhase('level_select')}}
          className="btn w-full max-w-xs py-5 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-black text-big shadow-lg">
          도전하기 ➡️
        </button>
      </div>
    </div>
  );

  /* 레벨 선택 */
  if(phase === 'level_select') return (
    <div className="w-full h-full flex flex-col bg-white">
      <Header label="📚 몇 문제 도전?" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center px-8 text-center">
        <h2 className="text-mega font-black text-slate-800 mb-3">몇 문제에 도전해볼까요?</h2>
        <p className="text-mid font-bold text-slate-400 mb-7 italic">마음에 드는 만큼 고를 수 있어요!</p>
        <div className="flex flex-col gap-4 w-full max-w-md">
          {[5,10,15].map((n,i)=>(
            <button key={n} onClick={()=>handleLevel(n)}
              className="btn py-6 bg-white border-4 border-pink-100 hover:border-pink-400 rounded-3xl font-black text-pink-500 shadow-md flex items-center justify-between px-7 whitespace-nowrap"
              style={{fontSize:'clamp(1.6rem,3.2vw,2.2rem)'}}>
              <span>{n}문제 도전</span>
              <span className="text-5xl">{['🌱','🌿','🌳'][i]}</span>
            </button>
          ))}
        </div>
      </div>
    </div>
  );

  /* 무드미터 인트로 - 큰 카드 4개 */
  if(phase === 'mood_intro') return (
    <>
      <MoodModal open={!!moodModal} onClose={closeMoodModal} activeQuad={moodModal?.quad} emotion={moodModal?.emotion} allEmotions={emotionData} soundOn={soundOn}/>
      <div className="w-full h-full flex flex-col" style={{background:'#fafbff'}}>
        <Header label="🎨 마음의 네 가지 색깔" soundOn={soundOn} toggleSound={toggleSound}/>
        <div className="flex-1 flex flex-col px-5 pb-4 overflow-hidden">
          <div className="text-center mb-3 shrink-0">
            <h2 className="text-big font-black text-slate-800 mb-1">
              {soundOn ? <HighlightedText text="우리 마음에는 네 가지 색깔이 있어요!" highlightIdx={highlightIdx}/> : '우리 마음에는 네 가지 색깔이 있어요!'}
            </h2>
            <p className="text-base-lg font-bold text-pink-500" style={{fontWeight:900}}>👆 카드를 눌러서 어떤 감정들이 있는지 확인해보세요!</p>
          </div>

          <div className="flex-1 grid grid-cols-2 gap-3 min-h-0">
            {[
              {key:'red',    title:'활기찬 힘듦',     sub:'화나고 무서운 마음',   icon:'🔥', textColor:'#b91c1c'},
              {key:'yellow', title:'활기찬 즐거움',   sub:'신나고 기쁜 마음',     icon:'☀️', textColor:'#b45309'},
              {key:'blue',   title:'잔잔한 힘듦',     sub:'슬프고 외로운 마음',   icon:'💧', textColor:'#1d4ed8'},
              {key:'green',  title:'잔잔한 평온',     sub:'편안하고 따뜻한 마음', icon:'🌿', textColor:'#047857'},
            ].map(q => {
              const count = emotionData.filter(e => e.quad === q.key).length;
              return (
                <button key={q.key} onClick={()=>openMoodModal(q.key, null)}
                  className={`mood-quad mood-${q.key} btn flex flex-col items-center justify-center text-center`}
                  style={{cursor:'pointer', padding:'16px'}}>
                  <div style={{fontSize:'clamp(3rem,6vw,4.5rem)', lineHeight:1, marginBottom:'10px'}}>{q.icon}</div>
                  <div style={{color: q.textColor, fontSize:'clamp(1.4rem,2.6vw,2rem)', fontWeight:900, whiteSpace:'nowrap'}}>{q.title}</div>
                  <div style={{color: q.textColor, fontSize:'clamp(1rem,1.8vw,1.3rem)', fontWeight:'bold', marginTop:'6px', marginBottom:'10px', whiteSpace:'nowrap'}}>{q.sub}</div>
                  <div className="bg-white rounded-full px-5 py-2 font-black text-slate-700 whitespace-nowrap shadow-md" style={{fontSize:'clamp(.95rem,1.7vw,1.15rem)',border:'2px solid '+q.textColor}}>
                    👉 감정 {count}개 보러 가기
                  </div>
                </button>
              );
            })}
          </div>

          <button onClick={()=>{sfx.click(soundOn); setPhase('concept')}}
            className="btn shrink-0 mt-4 w-full max-w-md mx-auto py-4 bg-indigo-500 hover:bg-indigo-600 text-white rounded-2xl font-black text-big shadow-lg">
            감정 배우러 가기 ▶
          </button>
        </div>
      </div>
    </>
  );

  /* 개념 학습 */
  if(phase === 'concept'){
    const em = conceptList[conceptIdx];
    if(!em){
      return <div className="w-full h-full flex items-center justify-center"><div className="w-12 h-12 border-4 border-pink-100 border-t-pink-500 rounded-full animate-spin"/></div>;
    }
    const quadInfo = QUADRANTS[em.quad] || QUADRANTS.yellow;
    return (
      <>
        <MoodModal open={!!moodModal} onClose={closeMoodModal} activeQuad={moodModal?.quad} emotion={moodModal?.emotion} allEmotions={emotionData} soundOn={soundOn}/>
        <div className="w-full h-full flex flex-col" style={{background:'#f8fbff'}}>
          <Header label={`💡 감정 배우기 ${conceptIdx+1}/${conceptList.length}`} soundOn={soundOn} toggleSound={toggleSound}/>
          <div className="flex-1 flex flex-col px-5 pb-4 overflow-hidden">
            <div className="card card-indigo flex-1 p-6 flex flex-col items-center text-center justify-center min-h-0 mb-3">
              {/* 마음지도 버튼 - 강조 */}
              <div className="click-hint mb-5">
                <button onClick={()=>openMoodModal(em.quad, em)}
                  className={`quad-badge quad-badge-${em.quad}`}>
                  <span style={{fontSize:'1.8rem'}}>{quadInfo.emoji}</span>
                  <span>{quadInfo.name}</span>
                  <span style={{fontSize:'1.1rem',background:'white',padding:'4px 10px',borderRadius:'999px'}}>🗺️ 마음지도</span>
                </button>
              </div>

              <div className="bg-indigo-50 border-3 border-indigo-200 rounded-2xl p-5 mb-4 w-full max-w-2xl">
                <p className="text-base-lg font-black text-slate-500 mb-2">📍 이런 상황이 있어요</p>
                <p className="text-big font-bold text-slate-700 italic word-keep">"{em.sit}"</p>
              </div>

              <div className="text-base-lg font-black text-slate-500 mb-3">⬇️ 그럴 땐 이런 마음이에요</div>

              <div className="flex items-center gap-4 mb-3 flex-wrap justify-center">
                <span style={{fontSize:'7rem', lineHeight:1}}>{em.emoji}</span>
                <h3 className="font-black" style={{color: quadInfo.color, fontSize:'clamp(3rem,6vw,5rem)', lineHeight:1.1}}>"{em.id}"</h3>
              </div>

              <p className="text-big font-bold text-slate-600 word-keep max-w-2xl">{em.desc}</p>
            </div>

            <button onClick={()=>{sfx.click(soundOn); if(conceptIdx < conceptList.length-1) setConceptIdx(c=>c+1); else { setQIdx(0); setPhase('activity'); }}}
              className="btn shrink-0 w-full py-5 rounded-2xl font-black text-big shadow-lg text-white"
              style={{backgroundColor:'#4338ca'}}>
              {conceptIdx < conceptList.length-1 ? '다음 감정 배우기 ➡️' : '퀴즈 시작! 🎯'}
            </button>
          </div>
        </div>
      </>
    );
  }

  /* 퀴즈 */
  if(phase === 'activity'){
    const list = reviewMode ? wrong : qs;
    const q = list[qIdx];
    if(!q){
      return <div className="w-full h-full flex items-center justify-center"><div className="w-12 h-12 border-4 border-pink-100 border-t-pink-500 rounded-full animate-spin"/></div>;
    }
    const ansEmotion = emotionData.find(e => e.id === q.a);
    const ansQuadInfo = ansEmotion ? QUADRANTS[ansEmotion.quad] : null;
    return (
      <>
        <MoodModal open={!!moodModal} onClose={closeMoodModal} activeQuad={moodModal?.quad} emotion={moodModal?.emotion} allEmotions={emotionData} soundOn={soundOn}/>
        <div className="w-full h-full flex flex-col bg-white relative">
          <StickerBurst trigger={stickerTrigger}/>
          <Header label={reviewMode ? '🔄 다시 풀기' : `🧩 감정 퀴즈 ${qIdx+1}/${list.length}`} soundOn={soundOn} toggleSound={toggleSound}/>
          <div className="flex-1 flex flex-col px-5 pb-4 overflow-hidden">
            <div className={`card card-pink flex-1 p-6 text-center min-h-0 flex flex-col ${fb?.ok===false?'shake':''}`}>
              {!fb ? (
                <div className="flex-1 flex flex-col items-center justify-center">
                  <div className="text-[100px] mb-4 float">{q.img}</div>
                  <h2 className="text-big font-black text-slate-800 mb-7 word-keep">
                    {soundOn ? <HighlightedText text={`"${q.q}"`} highlightIdx={highlightIdx}/> : `"${q.q}"`}
                  </h2>
                  <div className="grid grid-cols-2 gap-5 w-full max-w-2xl">
                    {q.opts.map((o,i)=>(
                      <button key={i} onClick={()=>checkAns(o)}
                        className="btn py-8 bg-slate-50 border-3 border-slate-200 hover:border-pink-400 hover:bg-pink-50 rounded-3xl font-black text-slate-700 shadow-sm"
                        style={{fontSize:'clamp(1.6rem,3vw,2.2rem)'}}>
                        {o}
                      </button>
                    ))}
                  </div>
                </div>
              ) : fb.ok ? (
                <div className="flex-1 flex flex-col items-center justify-center">
                  <div className="text-[90px] mb-2 bounce-in">🌟</div>
                  <h2 className="font-black mb-4 text-emerald-500" style={{fontSize:'clamp(2.4rem,5vw,3.6rem)'}}>정답이에요!</h2>

                  {ansEmotion && ansQuadInfo && (
                    <div className="click-hint mb-4">
                      <button onClick={()=>openMoodModal(ansEmotion.quad, ansEmotion)}
                        className={`quad-badge quad-badge-${ansEmotion.quad}`}>
                        <span style={{fontSize:'1.8rem'}}>{ansQuadInfo.emoji}</span>
                        <span>{ansQuadInfo.name}</span>
                        <span style={{fontSize:'1.1rem',background:'white',padding:'4px 10px',borderRadius:'999px'}}>🗺️ 마음지도</span>
                      </button>
                    </div>
                  )}

                  <div className="bg-emerald-50 border-3 border-emerald-200 rounded-2xl p-5 mb-5 max-w-3xl">
                    <p className="text-big font-bold text-slate-700 italic word-keep">{fb.msg}</p>
                  </div>

                  <button onClick={nextQ}
                    className="btn w-full max-w-xl py-5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl font-black text-big shadow-lg">
                    다음 문제로 ▶
                  </button>
                </div>
              ) : (
                <div className="flex-1 flex flex-col items-center justify-center">
                  <div className="text-[90px] mb-2 bounce-in">🤔</div>
                  <h2 className="font-black mb-4 text-amber-500" style={{fontSize:'clamp(2.4rem,5vw,3.6rem)'}}>앗, 다시 생각해봐요!</h2>
                  <div className="bg-amber-50 border-3 border-amber-200 rounded-2xl p-5 mb-5 max-w-3xl">
                    <p className="text-big font-bold text-slate-700 italic word-keep">{fb.msg}</p>
                  </div>
                  <p className="text-base-lg font-black text-slate-500 mb-3">⬇️ 다시 골라봐요!</p>
                  <div className="grid grid-cols-2 gap-5 w-full max-w-2xl">
                    {q.opts.map((o,i)=>(
                      <button key={i} onClick={()=>{ setFb(null); setTimeout(()=>checkAns(o), 50); }}
                        className={`btn py-7 rounded-3xl font-black shadow-sm border-3 ${
                          o === fb.picked
                            ? 'bg-slate-100 text-slate-400 border-slate-200'
                            : 'bg-pink-50 text-pink-600 border-pink-300 hover:bg-pink-100'
                        }`}
                        style={{fontSize:'clamp(1.5rem,2.8vw,2rem)'}}>
                        {o}
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      </>
    );
  }

  /* 재도전 안내 */
  if(phase === 'retry_intro') return (
    <div className="w-full h-full flex flex-col">
      <Header label="💡 한번 더!" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center text-center px-8">
        <div className="text-[110px] mb-5 float">💡</div>
        <h2 className="text-mega font-black text-slate-800 mb-3">포기하지 않는 마음이<br/>제일 멋져요!</h2>
        <p className="text-mid font-bold text-slate-400 mb-8">아쉬운 문제들을 다시 풀어볼까요?</p>
        <button onClick={()=>{sfx.click(soundOn); setReviewMode(true); setQIdx(0); setFb(null); setPhase('activity')}}
          className="btn py-5 px-12 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-black text-big shadow-lg">
          🔄 다시 도전!
        </button>
      </div>
    </div>
  );

  /* 자기 평가 */
  if(phase === 'self_rating') return (
    <div className="w-full h-full flex flex-col bg-white">
      <Header label="⭐ 나의 별점" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center px-8 text-center scroll-y">
        <h2 className="text-mega font-black text-slate-800 mb-3">오늘 공부 어땠나요?</h2>
        <p className="text-mid font-bold text-slate-400 mb-8 italic">별표를 눌러 알려주세요!</p>
        <div className="flex gap-3 mb-10 justify-center">
          {[1,2,3,4,5].map(s=>(
            <button key={s} onClick={()=>{sfx.star(soundOn); setStars(s)}}
              className={`text-7xl btn ${stars>=s?'scale-125 drop-shadow-lg':'opacity-25 grayscale'}`}>
              ⭐
            </button>
          ))}
        </div>
        {stars > 0 && (
          <button onClick={handleStarSubmit}
            className="btn w-full max-w-xs py-5 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-black text-big shadow-lg">
            다음으로 ➡️
          </button>
        )}
      </div>
    </div>
  );

  /* 별 3개 이하 → 다시 활동 */
  if(phase === 'low_star_retry') return (
    <div className="w-full h-full flex flex-col" style={{background:'#fff7ed'}}>
      <Header label="💪 한번 더 도전!" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center text-center px-8">
        <div className="text-[110px] mb-5 float">💪</div>
        <h2 className="text-mega font-black text-slate-800 mb-3">아직 더 알 수 있어요!</h2>
        <p className="text-mid font-bold text-slate-500 mb-8 word-keep">
          오늘은 별 {stars}개를 줬네요.<br/>
          한번 더 도전해서 더 잘 알아볼까요?
        </p>
        <div className="flex flex-col gap-4 w-full max-w-sm">
          <button onClick={doRetry}
            className="btn w-full py-5 bg-orange-500 hover:bg-orange-600 text-white rounded-2xl font-black text-big shadow-lg">
            🔄 다시 활동하기!
          </button>
          <button onClick={()=>{sfx.click(soundOn); setPhase('end_voice')}}
            className="btn w-full py-4 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-2xl font-black text-mid">
            이대로 끝내기
          </button>
        </div>
      </div>
    </div>
  );

  /* 마지막 다짐 녹음 */
  if(phase === 'end_voice') return (
    <div className="w-full h-full flex flex-col" style={{background:'#f0fdf4'}}>
      <Header label="🌟 나의 다짐" soundOn={soundOn} toggleSound={toggleSound}/>
      <div className="flex-1 flex flex-col items-center justify-center px-5 pb-3 overflow-hidden">
        <div className="text-5xl mb-2 float">🌈</div>
        <h2 className="text-big font-black text-slate-800 mb-3 text-center word-keep">
          {soundOn ? <HighlightedText text="오늘 배운 것을 떠올리며 다짐을 말해보세요!" highlightIdx={highlightIdx}/> : '오늘 배운 것을 떠올리며 다짐을 말해보세요!'}
        </h2>
        <VoiceRecorder
          prompt="🎙️ 내일은 어떻게 내 감정을 표현할까요?"
          example="속상할 때 친구에게 솔직하게 말해볼래요!"
          onComplete={handleEndVoiceComplete}
          soundOn={soundOn}
          color="emerald"
        />
        <button onClick={()=>{sfx.click(soundOn); setEndResolution({text:'',audioBase64:null}); setPhase('self_praise')}}
          className="mt-2 text-slate-300 hover:text-slate-500 underline font-bold text-base-lg shrink-0">
          넘어가기
        </button>
      </div>
    </div>
  );

  /* 자기 칭찬 스티커 */
  if(phase === 'self_praise'){
    const stickerOptions = [
      {emoji:'🌟', label:'반짝반짝 잘했어요!'},
      {emoji:'💖', label:'마음을 잘 표현했어요!'},
      {emoji:'🏆', label:'최고로 멋져요!'},
      {emoji:'🌈', label:'무지개처럼 빛나요!'},
      {emoji:'👑', label:'감정 왕이에요!'},
      {emoji:'🦄', label:'특별한 어린이!'},
    ];
    return (
      <div className="w-full h-full flex flex-col" style={{background:'#fef3f2'}}>
        <Header label="✨ 스스로 칭찬하기" soundOn={soundOn} toggleSound={toggleSound}/>
        <div className="flex-1 flex flex-col items-center px-5 pb-3 overflow-hidden">
          <h2 className="text-big font-black text-slate-800 mb-1 text-center shrink-0 word-keep">
            {soundOn ? <HighlightedText text="내 다짐을 듣고 스스로 칭찬해줘요!" highlightIdx={highlightIdx}/> : '내 다짐을 듣고 스스로 칭찬해줘요!'}
          </h2>
          <p className="text-base-lg font-bold text-slate-400 mb-3 italic shrink-0">노력한 나를 칭찬해주세요!</p>

          {endResolution.audioBase64 && (
            <div className="card card-pink p-3 mb-3 w-full max-w-md shrink-0">
              <p className="text-base-lg font-black text-pink-500 mb-1">🎙️ 내 다짐 듣기</p>
              <audio controls src={`data:audio/webm;base64,${endResolution.audioBase64}`} className="w-full"/>
              {endResolution.text && <p className="mt-1 text-base-lg font-bold text-slate-700 italic word-keep">"{endResolution.text}"</p>}
            </div>
          )}

          <div className="grid grid-cols-3 gap-2 w-full max-w-2xl mb-3 flex-1 min-h-0 content-center">
            {stickerOptions.map((s,i)=>(
              <button key={i} onClick={()=>{sfx.star(soundOn); setSelfSticker(s.label)}}
                className={`btn p-3 rounded-3xl border-4 flex flex-col items-center gap-1 justify-center
                  ${selfSticker===s.label?'border-pink-500 bg-pink-50 scale-105':'border-slate-100 bg-white hover:border-pink-300'}`}>
                <span className="text-4xl">{s.emoji}</span>
                <span className="text-base-lg font-black text-slate-700 word-keep text-center">{s.label}</span>
              </button>
            ))}
          </div>

          {selfSticker && (
            <button onClick={()=>{sfx.win(soundOn); confetti({particleCount:150,spread:90,origin:{y:.6}}); saveResult();}}
              className="btn w-full max-w-xs py-4 bg-pink-500 hover:bg-pink-600 text-white rounded-2xl font-black text-mid shadow-lg shrink-0 whitespace-nowrap">
              상장 받으러 가기 🏆
            </button>
          )}
        </div>
      </div>
    );
  }

  /* 최종 결과 */
  if(phase === 'report'){
    const learned = [...new Set(history.filter(h=>h.ok).map(h=>h.concept))];
    const correctCnt = history.filter(h=>h.ok).length;
    const accuracy = history.length > 0 ? Math.round(correctCnt/history.length*100) : 0;

    return (
      <div className="w-full h-full flex flex-col bg-white relative overflow-hidden">
        {saving && (
          <div className="absolute inset-0 bg-white/90 flex flex-col items-center justify-center z-50 rounded-[2rem]">
            <div className="w-14 h-14 border-4 border-pink-100 border-t-pink-500 rounded-full animate-spin mb-4"/>
            <p className="text-big font-black text-slate-700">기록을 저장하는 중이에요...</p>
          </div>
        )}

        <div className="flex-1 flex flex-col px-5 py-3 overflow-hidden">
          {/* 제목 - 컴팩트하게 */}
          <div className="text-center mb-2 shrink-0">
            <div className="text-4xl mb-1 float">🏆</div>
            <h1 className="text-big font-black text-slate-900 whitespace-nowrap">감정 알기 대장 상장</h1>
            <p className="text-base-lg font-bold text-slate-400">+ 오늘의 배움 기록표</p>
          </div>

          {/* 가로 2열: 상장 + 배움기록표 */}
          <div className="flex-1 grid grid-cols-1 md:grid-cols-2 gap-3 min-h-0 mb-3">
            {/* 상장 */}
            <div className="card card-amber p-4 text-center flex flex-col justify-center overflow-hidden">
              <div className="text-4xl mb-2">🏅</div>
              <h3 className="text-mid font-black text-pink-600 mb-2 word-keep">🌟 {student} 어린이 🌟</h3>
              <p className="text-base-lg font-bold text-slate-500 italic mb-2 leading-relaxed word-keep">
                자신의 감정을 바르게 이해하고<br/>표현하는 멋진 대장이 되었어요!
              </p>
              <div className="text-2xl mb-1">{'⭐'.repeat(stars)}{'☆'.repeat(5-stars)}</div>
              {selfSticker && <p className="text-base-lg font-black text-pink-600 word-keep">"{selfSticker}"</p>}
            </div>

            {/* 배움기록표 */}
            <div className="card card-indigo p-4 flex flex-col overflow-hidden">
              <h3 className="text-mid font-black text-indigo-600 mb-2 text-center whitespace-nowrap">📋 오늘의 배움 기록표</h3>

              <div className="grid grid-cols-4 gap-1 mb-2 shrink-0">
                <div className="bg-pink-50 rounded-xl p-2 text-center border-2 border-pink-100">
                  <div className="font-black text-pink-600" style={{fontSize:'1.4rem'}}>{history.length}</div>
                  <div className="text-xs font-bold text-slate-500">문제</div>
                </div>
                <div className="bg-emerald-50 rounded-xl p-2 text-center border-2 border-emerald-100">
                  <div className="font-black text-emerald-600" style={{fontSize:'1.4rem'}}>{correctCnt}</div>
                  <div className="text-xs font-bold text-slate-500">맞힘</div>
                </div>
                <div className="bg-blue-50 rounded-xl p-2 text-center border-2 border-blue-100">
                  <div className="font-black text-blue-600" style={{fontSize:'1.4rem'}}>{accuracy}%</div>
                  <div className="text-xs font-bold text-slate-500">정답률</div>
                </div>
                <div className="bg-amber-50 rounded-xl p-2 text-center border-2 border-amber-100">
                  <div className="font-black text-amber-600" style={{fontSize:'1.4rem'}}>{learned.length}</div>
                  <div className="text-xs font-bold text-slate-500">배운 감정</div>
                </div>
              </div>

              {learned.length > 0 && (
                <div className="bg-pink-50 rounded-xl p-2 border-2 border-pink-100 flex-1 min-h-0 overflow-y-auto">
                  <p className="text-base-lg font-black text-pink-600 mb-1">✨ 오늘 배운 감정</p>
                  <div className="flex flex-wrap gap-1">
                    {learned.map((id,i)=>{
                      const em = emotionData.find(e=>e.id===id) || {};
                      return (
                        <span key={i} className="bg-white border border-pink-200 rounded-full px-2 py-1 text-base-lg font-black text-slate-700 whitespace-nowrap">
                          {em.emoji} {id}
                        </span>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          </div>

          {/* 버튼 */}
          <div className="flex gap-3 shrink-0">
            <button onClick={()=>{sfx.win(soundOn); downloadCertificate(student, learned, stars, history, selfSticker)}}
              className="btn flex-1 py-4 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl font-black text-mid shadow-lg whitespace-nowrap">
              🖼️ 상장+기록표 저장
            </button>
            <button onClick={()=>window.location.reload()}
              className="btn flex-1 py-4 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl font-black text-mid shadow-lg whitespace-nowrap">
              🏠 처음으로
            </button>
          </div>
        </div>
      </div>
    );
  }

  return null;
};

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
